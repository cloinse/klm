<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KLM Feedback Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #191e27;
        --panel-soft: #202733;
        --border: #303a49;
        --text: #edf2f7;
        --muted: #9ba9b9;
        --accent: #7dd3fc;
        --danger: #fb7185;
        --success: #86efac;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: radial-gradient(circle at top right, #1d2d3d 0, var(--bg) 45%);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { max-width: 1240px; margin: 0 auto; padding: 36px 22px 60px; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 6px; font-size: 30px; }
      h2 { margin-bottom: 14px; font-size: 18px; }
      .subtitle, .muted { color: var(--muted); }
      .panel { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 18px 50px #0003; }
      .login { max-width: 520px; margin: 11vh auto 0; }
      label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }
      input, select, button { font: inherit; }
      input, select { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--panel-soft); color: var(--text); }
      button { border: 0; border-radius: 9px; padding: 10px 14px; background: var(--accent); color: #08202b; cursor: pointer; font-weight: 700; }
      button.secondary { background: var(--panel-soft); color: var(--text); border: 1px solid var(--border); }
      button.danger { background: transparent; color: var(--danger); border: 1px solid #7f3045; }
      button:disabled { cursor: wait; opacity: .55; }
      .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
      .row > * { flex: 1; }
      .actions { display: flex; gap: 10px; align-items: center; }
      .error { margin: 14px 0 0; color: var(--danger); }
      .notice { margin: 14px 0; color: var(--success); }
      .hidden { display: none !important; }
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 26px 0 16px; }
      .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
      .stat strong { display: block; font-size: 25px; }
      .stat span { color: var(--muted); font-size: 13px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 920px; }
      th, td { border-bottom: 1px solid var(--border); padding: 13px 10px; text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
      td.message { min-width: 300px; white-space: pre-wrap; word-break: break-word; }
      td small { display: block; color: var(--muted); }
      td select { min-width: 115px; }
      .empty { padding: 32px 0; text-align: center; color: var(--muted); }
      @media (max-width: 720px) {
        main { padding: 22px 14px 40px; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="login" class="panel login">
        <h1>KLM Feedback</h1>
        <p class="subtitle">Local administrator for the remote D1 database.</p>
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="off" placeholder="Enter the token from .dev.vars">
        <div class="actions" style="margin-top: 14px">
          <button id="login-button">Open dashboard</button>
        </div>
        <p id="login-error" class="error hidden"></p>
      </section>

      <section id="dashboard" class="hidden">
        <div class="row" style="align-items: center">
          <div>
            <h1>KLM Feedback</h1>
            <p class="subtitle">Local administrator · changes affect the production D1 database.</p>
          </div>
          <div class="actions" style="justify-content: end">
            <button id="refresh-button" class="secondary">Refresh</button>
            <button id="logout-button" class="secondary">Log out</button>
          </div>
        </div>

        <div id="stats" class="stats"></div>

        <section class="panel">
          <div class="row" style="align-items: center; margin-bottom: 12px">
            <div>
              <h2 style="margin-bottom: 0">Feedback</h2>
            </div>
            <label style="max-width: 180px; margin: 0">
              Filter
              <select id="status-filter">
                <option value="all">All</option>
                <option value="new">New</option>
                <option value="reviewed">Reviewed</option>
                <option value="resolved">Resolved</option>
              </select>
            </label>
          </div>
          <p id="dashboard-error" class="error hidden"></p>
          <p id="dashboard-notice" class="notice hidden"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Message</th>
                  <th>Contact</th>
                  <th>App</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="feedback-body"></tbody>
            </table>
          </div>
          <p id="empty-state" class="empty hidden">No feedback found.</p>
        </section>
      </section>
    </main>

    <script>
      const tokenStorageKey = 'klm-feedback-admin-token';
      const state = { token: '', status: 'all' };
      const $ = (selector) => document.querySelector(selector);

      function getStoredToken() {
        try { return sessionStorage.getItem(tokenStorageKey) || ''; } catch (_) { return ''; }
      }

      function setStoredToken(token) {
        try {
          if (token) sessionStorage.setItem(tokenStorageKey, token);
          else sessionStorage.removeItem(tokenStorageKey);
        } catch (_) {}
      }

      function showError(selector, message) {
        const element = $(selector);
        element.textContent = message;
        element.classList.toggle('hidden', !message);
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            ...(options.body ? { 'content-type': 'application/json' } : {}),
            authorization: `Bearer ${state.token}`,
            ...(options.headers || {}),
          },
        });
        if (response.status === 401) throw new Error('unauthorized');
        if (!response.ok) {
          let message = `Request failed (${response.status})`;
          try { message = (await response.json()).error || message; } catch (_) {}
          throw new Error(message);
        }
        return response.status === 204 ? null : response.json();
      }

      function formatDate(value) {
        const date = new Date(`${value.replace(' ', 'T')}Z`);
        return Number.isNaN(date.valueOf()) ? value : date.toLocaleString();
      }

      function cell(text, className = '') {
        const element = document.createElement('td');
        element.textContent = text ?? '—';
        if (className) element.className = className;
        return element;
      }

      function renderStats(counts) {
        const items = [
          ['all', 'All'],
          ['new', 'New'],
          ['reviewed', 'Reviewed'],
          ['resolved', 'Resolved'],
        ];
        $('#stats').replaceChildren(...items.map(([key, label]) => {
          const card = document.createElement('div');
          card.className = 'stat';
          const value = document.createElement('strong');
          value.textContent = counts[key] ?? 0;
          const title = document.createElement('span');
          title.textContent = label;
          card.append(value, title);
          return card;
        }));
      }

      function renderRows(items) {
        const body = $('#feedback-body');
        body.replaceChildren();
        $('#empty-state').classList.toggle('hidden', items.length !== 0);

        for (const item of items) {
          const row = document.createElement('tr');
          row.append(
            cell(formatDate(item.created_at)),
            cell(item.type),
            cell(item.message, 'message'),
          );

          const contact = document.createElement('td');
          contact.textContent = item.email || '—';
          row.append(contact);

          const app = document.createElement('td');
          app.textContent = item.app_version || '—';
          if (item.platform || item.locale) {
            const details = document.createElement('small');
            details.textContent = [item.platform, item.locale].filter(Boolean).join(' · ');
            app.append(details);
          }
          row.append(app);

          const statusCell = document.createElement('td');
          const select = document.createElement('select');
          for (const status of ['new', 'reviewed', 'resolved']) {
            const option = document.createElement('option');
            option.value = status;
            option.textContent = status;
            option.selected = status === item.status;
            select.append(option);
          }
          select.addEventListener('change', () => updateStatus(item.id, select.value));
          statusCell.append(select);
          row.append(statusCell);

          const actions = document.createElement('td');
          const deleteButton = document.createElement('button');
          deleteButton.className = 'danger';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', () => deleteFeedback(item.id, deleteButton));
          actions.append(deleteButton);
          row.append(actions);
          body.append(row);
        }
      }

      async function loadFeedback() {
        showError('#dashboard-error', '');
        $('#refresh-button').disabled = true;
        try {
          const data = await api(`/api/feedback?status=${encodeURIComponent(state.status)}`);
          renderStats(data.counts);
          renderRows(data.items);
        } catch (error) {
          if (error.message === 'unauthorized') return logout();
          showError('#dashboard-error', error.message);
        } finally {
          $('#refresh-button').disabled = false;
        }
      }

      async function updateStatus(id, status) {
        try {
          await api(`/api/feedback/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status }),
          });
          showNotice('Status updated.');
          await loadFeedback();
        } catch (error) {
          if (error.message === 'unauthorized') return logout();
          showError('#dashboard-error', error.message);
        }
      }

      async function deleteFeedback(id, button) {
        if (!confirm(`Delete feedback #${id}? This cannot be undone.`)) return;
        button.disabled = true;
        try {
          await api(`/api/feedback/${id}`, { method: 'DELETE' });
          showNotice('Feedback deleted.');
          await loadFeedback();
        } catch (error) {
          if (error.message === 'unauthorized') return logout();
          showError('#dashboard-error', error.message);
          button.disabled = false;
        }
      }

      function showNotice(message) {
        const notice = $('#dashboard-notice');
        notice.textContent = message;
        notice.classList.remove('hidden');
        setTimeout(() => notice.classList.add('hidden'), 2800);
      }

      function logout() {
        state.token = '';
        setStoredToken('');
        $('#dashboard').classList.add('hidden');
        $('#login').classList.remove('hidden');
        $('#token').value = '';
      }

      async function login() {
        const token = $('#token').value.trim();
        if (!token) return showError('#login-error', 'Enter an admin token.');
        state.token = token;
        $('#login-button').disabled = true;
        showError('#login-error', '');
        try {
          const response = await api('/api/feedback');
          setStoredToken(token);
          $('#login').classList.add('hidden');
          $('#dashboard').classList.remove('hidden');
          renderStats(response.counts);
          renderRows(response.items);
        } catch (error) {
          state.token = '';
          showError('#login-error', error.message === 'unauthorized' ? 'Invalid admin token.' : error.message);
        } finally {
          $('#login-button').disabled = false;
        }
      }

      $('#login-button').addEventListener('click', login);
      $('#token').addEventListener('keydown', (event) => { if (event.key === 'Enter') login(); });
      $('#refresh-button').addEventListener('click', loadFeedback);
      $('#logout-button').addEventListener('click', logout);
      $('#status-filter').addEventListener('change', (event) => {
        state.status = event.target.value;
        loadFeedback();
      });

      const initialToken = getStoredToken();
      if (initialToken) {
        state.token = initialToken;
        $('#token').value = initialToken;
        login();
      }
    </script>
  </body>
</html>

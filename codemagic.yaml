workflows:
  macos-catalina-legacy:
    name: Kontakt Library Manager - macOS 10.15 (Flutter 3.38)
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - klm_secrets
      vars:
        KLM_MACOS_DEPLOYMENT_TARGET: "10.15"
        KLM_APP_NAME: "Kontakt Library Manager"
      # Flutter 3.44.8 can fail while initializing DartVM on some Catalina
      # Intel systems, so the legacy artifact stays on the previous engine.
      flutter: 3.38.9
      xcode: 16.4
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/pip

    scripts:
      - name: Configure macOS 10.15 deployment target
        script: |
          set -euo pipefail
          flutter clean

          KLM_PROJECT_FILE="macos/Runner.xcodeproj/project.pbxproj"
          KLM_SOURCE_TARGET_COUNT=$(/usr/bin/grep -c \
            'MACOSX_DEPLOYMENT_TARGET = 12.0;' \
            "$KLM_PROJECT_FILE")
          test "$KLM_SOURCE_TARGET_COUNT" -eq 6

          /usr/bin/sed -i '' \
            "s/MACOSX_DEPLOYMENT_TARGET = 12.0;/MACOSX_DEPLOYMENT_TARGET = ${KLM_MACOS_DEPLOYMENT_TARGET};/g" \
            "$KLM_PROJECT_FILE"

          KLM_LEGACY_TARGET_COUNT=$(/usr/bin/grep -c \
            "MACOSX_DEPLOYMENT_TARGET = ${KLM_MACOS_DEPLOYMENT_TARGET};" \
            "$KLM_PROJECT_FILE")
          test "$KLM_LEGACY_TARGET_COUNT" -eq 6
          ! /usr/bin/grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 12.0;' \
            "$KLM_PROJECT_FILE"

          KLM_APP_INFO="macos/Runner/Configs/AppInfo.xcconfig"
          test "$(/usr/bin/grep -c \
            'KLM_UPDATE_FEED_NAME = appcast-macos-legacy' \
            "$KLM_APP_INFO")" -eq 1
          ! /usr/bin/grep -q \
            'KLM_UPDATE_FEED_NAME = appcast-macos-current' \
            "$KLM_APP_INFO"

      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          KLM_FLUTTER_VERSION="$(flutter --version)"
          KLM_DART_VERSION="$(dart --version 2>&1)"
          KLM_XCODE_VERSION="$(xcodebuild -version)"

          /usr/bin/printf '%s\n' "$KLM_FLUTTER_VERSION"
          /usr/bin/printf '%s\n' "$KLM_DART_VERSION"
          /usr/bin/printf '%s\n' "$KLM_XCODE_VERSION"

          case "$KLM_FLUTTER_VERSION" in
            *'Flutter 3.38.9'*) ;;
            *) exit 1 ;;
          esac
          case "$KLM_DART_VERSION" in
            *'Dart SDK version: 3.10.8'*) ;;
            *) exit 1 ;;
          esac
          case "$KLM_XCODE_VERSION" in
            *'Xcode 16.4'*) ;;
            *) exit 1 ;;
          esac

          flutter pub get

      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub
          KLM_LOCATION_TEST="$(/usr/bin/mktemp /tmp/klm-location-test.XXXXXX)"
          xcrun swiftc \
            macos/Runner/Native/InstallationLocationValidator.swift \
            test/native_install_location/main.swift \
            -o "$KLM_LOCATION_TEST"
          "$KLM_LOCATION_TEST"
          /bin/rm "$KLM_LOCATION_TEST"

      - name: Build universal macOS Release
        script: flutter build macos --release --no-pub

      - name: Prepare ad-hoc Sparkle bundle
        script: |
          set -euo pipefail
          tool/prepare_adhoc_sparkle.sh \
            "build/macos/Build/Products/Release/${KLM_APP_NAME}.app"

      - name: Verify Catalina compatibility
        script: |
          set -euo pipefail
          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_MAIN_BINARY="$KLM_APP_PATH/Contents/MacOS/$KLM_APP_NAME"
          KLM_HELPER_BINARY="$KLM_APP_PATH/Contents/Resources/KontaktLibraryHelper"
          KLM_FLUTTER_BINARY="$KLM_APP_PATH/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"
          KLM_DART_BINARY="$KLM_APP_PATH/Contents/Frameworks/App.framework/Versions/A/App"
          KLM_SPARKLE_BINARY="$KLM_APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          KLM_PACKAGE_FILE="macos/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"

          test -d "$KLM_APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :LSMinimumSystemVersion' \
            "$KLM_APP_PATH/Contents/Info.plist")" = "$KLM_MACOS_DEPLOYMENT_TARGET"
          /usr/bin/grep -Fq \
            ".macOS(\"$KLM_MACOS_DEPLOYMENT_TARGET\")" \
            "$KLM_PACKAGE_FILE"

          verify_binary() {
            KLM_BINARY_PATH="$1"
            /usr/bin/file "$KLM_BINARY_PATH"
            KLM_BINARY_ARCHS="$(/usr/bin/lipo "$KLM_BINARY_PATH" -archs)"
            case " $KLM_BINARY_ARCHS " in
              *' x86_64 '*) ;;
              *) exit 1 ;;
            esac
            case " $KLM_BINARY_ARCHS " in
              *' arm64 '*) ;;
              *) exit 1 ;;
            esac
            KLM_INTEL_MINOS=$(xcrun vtool -arch x86_64 -show-build "$KLM_BINARY_PATH" | \
              /usr/bin/awk '/minos/ { print $2 }' | \
              /usr/bin/sort -u)
            test "$KLM_INTEL_MINOS" = "$KLM_MACOS_DEPLOYMENT_TARGET"

            # Apple Silicon starts at macOS 11, so an arm64 framework may
            # correctly report 11.0 even though its Intel slice supports 10.15.
            KLM_ARM_MINOS=$(xcrun vtool -arch arm64 -show-build "$KLM_BINARY_PATH" | \
              /usr/bin/awk '/minos/ { print $2 }' | \
              /usr/bin/sort -u)
            case "$KLM_ARM_MINOS" in
              10.15|11.0) ;;
              *) exit 1 ;;
            esac
          }

          verify_binary "$KLM_MAIN_BINARY"
          verify_binary "$KLM_HELPER_BINARY"
          verify_binary "$KLM_FLUTTER_BINARY"
          verify_binary "$KLM_DART_BINARY"

          KLM_SPARKLE_ARCHS="$(/usr/bin/lipo "$KLM_SPARKLE_BINARY" -archs)"
          case " $KLM_SPARKLE_ARCHS " in
            *' x86_64 '*) ;;
            *) exit 1 ;;
          esac
          case " $KLM_SPARKLE_ARCHS " in
            *' arm64 '*) ;;
            *) exit 1 ;;
          esac
          test ! -e \
            "$KLM_APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices"

          # The elevated helper must be self-contained. Flutter 3.38 can expose
          # the Runner's plugin linker flags through the project configuration;
          # loading those app frameworks in an elevated process is rejected by
          # macOS library validation when the build uses ad-hoc signing.
          KLM_HELPER_LINKS="$(/usr/bin/otool -L "$KLM_HELPER_BINARY")"
          /usr/bin/printf '%s\n' "$KLM_HELPER_LINKS"
          case "$KLM_HELPER_LINKS" in
            *'@rpath/'*|*'FlutterMacOS'*|*'shared_preferences_foundation'*)
              /usr/bin/printf '%s\n' \
                'The administrator helper contains an unexpected Flutter dependency.' >&2
              exit 1
              ;;
          esac

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$KLM_APP_PATH"

      - name: Package legacy DMG
        script: |
          set -euo pipefail
          KLM_LEGACY_DIRECTORY="build/legacy"
          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_VERSION="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' \
            "$KLM_APP_PATH/Contents/Info.plist")"
          KLM_DMG="$KLM_LEGACY_DIRECTORY/klm-macOS-v${KLM_VERSION}.dmg"
          /bin/mkdir -p "$KLM_LEGACY_DIRECTORY"
          KLM_PREPARE_APP=false \
            tool/package_macos_dmg.sh "$KLM_APP_PATH" "$KLM_DMG"

      - name: Generate signed legacy appcast
        script: |
          set -euo pipefail
          if test -z "${KLM_SPARKLE_PRIVATE_KEY:-}"; then
            /usr/bin/printf '%s\n' \
              'KLM_SPARKLE_PRIVATE_KEY is not configured; appcast generation skipped.'
            exit 0
          fi

          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_VERSION="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' \
            "$KLM_APP_PATH/Contents/Info.plist")"
          export KLM_UPDATE_DOWNLOAD_URL_PREFIX="https://github.com/cloinse/klm/releases/download/v${KLM_VERSION}"
          tool/generate_macos_appcast.sh \
            build/legacy \
            build/legacy/appcast-macos-legacy.xml

    artifacts:
      - build/legacy/*.dmg
      - build/legacy/*.dmg.sha256
      - build/legacy/appcast-macos-legacy.xml

  windows-release:
    name: Kontakt Library Manager - Windows
    instance_type: windows_x2
    max_build_duration: 20

    environment:
      groups:
        - klm_secrets
      flutter: stable

    cache:
      cache_paths:
        - ~/.pub-cache
        - $CM_BUILD_DIR/build/windows/x64
        - ~/.klm-tools/winsparkle-0.9.4
        - ~/.klm-tools/inno-7.0.2

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Prepare verified Windows packaging tools
        script: |
          $ErrorActionPreference = 'Stop'

          $ToolsRoot = Join-Path $env:USERPROFILE '.klm-tools'
          New-Item -ItemType Directory -Force -Path $ToolsRoot | Out-Null
          $WinSparkleRoot = Join-Path $ToolsRoot 'winsparkle-0.9.4'
          $WinSparkleDll = Join-Path $WinSparkleRoot 'WinSparkle.dll'
          $WinSparkleTool = Join-Path $WinSparkleRoot 'winsparkle-tool.exe'
          if (-not (Test-Path $WinSparkleDll) -or
              -not (Test-Path $WinSparkleTool)) {
            $WinSparkleArchive = Join-Path $env:TEMP 'WinSparkle-0.9.4.zip'
            & curl.exe --fail --location --silent --show-error --retry 3 `
              --output $WinSparkleArchive `
              'https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip'
            if ($LASTEXITCODE -ne 0) { throw 'WinSparkle download failed.' }
            $ActualHash = (Get-FileHash $WinSparkleArchive -Algorithm SHA256).Hash.ToLower()
            if ($ActualHash -ne '6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976') {
              throw 'WinSparkle archive checksum mismatch.'
            }
            Remove-Item $WinSparkleRoot -Recurse -Force -ErrorAction SilentlyContinue
            $ExtractRoot = Join-Path $env:TEMP 'klm-winsparkle-extract'
            Remove-Item $ExtractRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $ExtractRoot | Out-Null
            & 7z x -y "-o$ExtractRoot" $WinSparkleArchive `
              'WinSparkle-0.9.4\x64\Release\WinSparkle.dll' `
              'WinSparkle-0.9.4\bin\winsparkle-tool.exe'
            if ($LASTEXITCODE -ne 0) { throw 'WinSparkle extraction failed.' }
            New-Item -ItemType Directory -Force -Path $WinSparkleRoot | Out-Null
            $ExtractedSdk = Join-Path $ExtractRoot 'WinSparkle-0.9.4'
            Copy-Item (Join-Path $ExtractedSdk 'x64\Release\WinSparkle.dll') `
              $WinSparkleDll
            Copy-Item (Join-Path $ExtractedSdk 'bin\winsparkle-tool.exe') `
              $WinSparkleTool
          }

          $InnoRoot = Join-Path $ToolsRoot 'inno-7.0.2'
          $InnoCompiler = Join-Path $InnoRoot 'ISCC.exe'
          if (-not (Test-Path $InnoCompiler)) {
            $InnoInstaller = Join-Path $env:TEMP 'innosetup-7.0.2-x64.exe'
            & curl.exe --fail --location --silent --show-error --retry 3 `
              --output $InnoInstaller `
              'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
            $ActualHash = (Get-FileHash $InnoInstaller -Algorithm SHA256).Hash.ToLower()
            if ($ActualHash -ne '5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1') {
              throw 'Inno Setup installer checksum mismatch.'
            }
            New-Item -ItemType Directory -Force -Path $InnoRoot | Out-Null
            $InnoLog = Join-Path $env:TEMP 'klm-inno-install.log'
            $InnoProcess = Start-Process -FilePath $InnoInstaller `
              -ArgumentList @(
                '/VERYSILENT',
                '/SUPPRESSMSGBOXES',
                '/NORESTART',
                '/CURRENTUSER',
                "/DIR=$InnoRoot",
                "/LOG=$InnoLog"
              ) `
              -Wait -PassThru
            if ($InnoProcess.ExitCode -ne 0 -or
                -not (Test-Path $InnoCompiler)) {
              if (Test-Path $InnoLog) { Get-Content $InnoLog -Tail 80 }
              throw "Inno Setup installation failed with exit code $($InnoProcess.ExitCode)."
            }
          }

          $UpdaterDirectory = 'windows\runner\third_party\winsparkle'
          New-Item -ItemType Directory -Force -Path $UpdaterDirectory | Out-Null
          Copy-Item $WinSparkleDll (Join-Path $UpdaterDirectory 'WinSparkle.dll') -Force

      - name: Build Windows Release
        script: flutter build windows --release --no-pub

      - name: Build signed Windows installer feed
        script: |
          $ErrorActionPreference = 'Stop'
          $VersionMatch = Select-String -Path 'pubspec.yaml' `
            -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$'
          if ($VersionMatch.Matches.Count -ne 1) {
            throw 'pubspec.yaml must contain a semantic version and numeric build.'
          }
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          $Build = $VersionMatch.Matches[0].Groups[2].Value
          $ReleaseDirectory = (Resolve-Path 'build\windows\x64\runner\Release').Path
          if (-not (Test-Path (Join-Path $ReleaseDirectory 'WinSparkle.dll'))) {
            throw 'The release bundle does not contain WinSparkle.dll.'
          }

          $OutputDirectory = Join-Path $env:CM_BUILD_DIR `
            'build\windows\x64\runner\installer'
          New-Item -ItemType Directory -Force -Path $OutputDirectory | Out-Null
          $InnoCompiler = Join-Path $env:USERPROFILE `
            '.klm-tools\inno-7.0.2\ISCC.exe'
          & $InnoCompiler `
            "/DMyAppVersion=$Version" `
            "/DMyAppBuild=$Build" `
            "/DMySourceDir=$ReleaseDirectory" `
            "/DMyOutputDir=$OutputDirectory" `
            'windows\installer\kontakt_library_manager.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

          $Installer = Join-Path $OutputDirectory `
            "klm-windows-v$Version.exe"
          if (-not (Test-Path $Installer)) { throw 'Installer was not created.' }
          $InstallerHash = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLower()
          $HashPath = "$Installer.sha256"
          [IO.File]::WriteAllText(
            $HashPath,
            "$InstallerHash  $([IO.Path]::GetFileName($Installer))`n",
            [Text.UTF8Encoding]::new($false)
          )

          if ([string]::IsNullOrWhiteSpace($env:KLM_SPARKLE_PRIVATE_KEY)) {
            Write-Host 'KLM_SPARKLE_PRIVATE_KEY is not configured; appcast generation skipped.'
            exit 0
          }
          $env:KLM_UPDATE_DOWNLOAD_URL_PREFIX = `
            "https://github.com/cloinse/klm/releases/download/v$Version"
          $WinSparkleTool = Join-Path $env:USERPROFILE `
            '.klm-tools\winsparkle-0.9.4\winsparkle-tool.exe'
          & 'tool\generate_windows_appcast.ps1' `
            -InstallerPath $Installer `
            -OutputPath (Join-Path $OutputDirectory 'appcast-windows.xml') `
            -Version $Version `
            -Build $Build `
            -WinSparkleTool $WinSparkleTool

    artifacts:
      - build/windows/x64/runner/installer/*.exe
      - build/windows/x64/runner/installer/*.sha256
      - build/windows/x64/runner/installer/appcast-windows.xml

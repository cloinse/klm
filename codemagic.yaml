workflows:
  macos-catalina-legacy:
    name: Kontakt Library Manager - macOS 10.15 (Flutter 3.38)
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - klm_secrets
      vars:
        KLM_MACOS_DEPLOYMENT_TARGET: "10.15"
        KLM_APP_NAME: "Kontakt Library Manager"
      # Flutter 3.44.8 can fail while initializing DartVM on some Catalina
      # Intel systems, so the legacy artifact stays on the previous engine.
      flutter: 3.38.9
      xcode: 16.4
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/pip

    scripts:
      - name: Configure macOS 10.15 deployment target
        script: |
          set -euo pipefail
          flutter clean

          KLM_PROJECT_FILE="macos/Runner.xcodeproj/project.pbxproj"
          KLM_SOURCE_TARGET_COUNT=$(/usr/bin/grep -c \
            'MACOSX_DEPLOYMENT_TARGET = 12.0;' \
            "$KLM_PROJECT_FILE")
          test "$KLM_SOURCE_TARGET_COUNT" -eq 6

          /usr/bin/sed -i '' \
            "s/MACOSX_DEPLOYMENT_TARGET = 12.0;/MACOSX_DEPLOYMENT_TARGET = ${KLM_MACOS_DEPLOYMENT_TARGET};/g" \
            "$KLM_PROJECT_FILE"

          KLM_LEGACY_TARGET_COUNT=$(/usr/bin/grep -c \
            "MACOSX_DEPLOYMENT_TARGET = ${KLM_MACOS_DEPLOYMENT_TARGET};" \
            "$KLM_PROJECT_FILE")
          test "$KLM_LEGACY_TARGET_COUNT" -eq 6
          ! /usr/bin/grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 12.0;' \
            "$KLM_PROJECT_FILE"

          KLM_APP_INFO="macos/Runner/Configs/AppInfo.xcconfig"
          test "$(/usr/bin/grep -c \
            'KLM_UPDATE_FEED_NAME = appcast-macos-legacy' \
            "$KLM_APP_INFO")" -eq 1
          ! /usr/bin/grep -q \
            'KLM_UPDATE_FEED_NAME = appcast-macos-current' \
            "$KLM_APP_INFO"

      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          KLM_FLUTTER_VERSION="$(flutter --version)"
          KLM_DART_VERSION="$(dart --version 2>&1)"
          KLM_XCODE_VERSION="$(xcodebuild -version)"

          /usr/bin/printf '%s\n' "$KLM_FLUTTER_VERSION"
          /usr/bin/printf '%s\n' "$KLM_DART_VERSION"
          /usr/bin/printf '%s\n' "$KLM_XCODE_VERSION"

          case "$KLM_FLUTTER_VERSION" in
            *'Flutter 3.38.9'*) ;;
            *) exit 1 ;;
          esac
          case "$KLM_DART_VERSION" in
            *'Dart SDK version: 3.10.8'*) ;;
            *) exit 1 ;;
          esac
          case "$KLM_XCODE_VERSION" in
            *'Xcode 16.4'*) ;;
            *) exit 1 ;;
          esac

          flutter pub get

      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub
          KLM_LOCATION_TEST="$(/usr/bin/mktemp /tmp/klm-location-test.XXXXXX)"
          xcrun swiftc \
            macos/Runner/Native/InstallationLocationValidator.swift \
            test/native_install_location/main.swift \
            -o "$KLM_LOCATION_TEST"
          "$KLM_LOCATION_TEST"
          /bin/rm "$KLM_LOCATION_TEST"

      - name: Build universal macOS Release
        script: flutter build macos --release --no-pub

      - name: Prepare ad-hoc Sparkle bundle
        script: |
          set -euo pipefail
          tool/prepare_adhoc_sparkle.sh \
            "build/macos/Build/Products/Release/${KLM_APP_NAME}.app"

      - name: Verify Catalina compatibility
        script: |
          set -euo pipefail
          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_MAIN_BINARY="$KLM_APP_PATH/Contents/MacOS/$KLM_APP_NAME"
          KLM_HELPER_BINARY="$KLM_APP_PATH/Contents/Resources/KontaktLibraryHelper"
          KLM_FLUTTER_BINARY="$KLM_APP_PATH/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"
          KLM_DART_BINARY="$KLM_APP_PATH/Contents/Frameworks/App.framework/Versions/A/App"
          KLM_SPARKLE_BINARY="$KLM_APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          KLM_PACKAGE_FILE="macos/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift"

          test -d "$KLM_APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :LSMinimumSystemVersion' \
            "$KLM_APP_PATH/Contents/Info.plist")" = "$KLM_MACOS_DEPLOYMENT_TARGET"
          /usr/bin/grep -Fq \
            ".macOS(\"$KLM_MACOS_DEPLOYMENT_TARGET\")" \
            "$KLM_PACKAGE_FILE"

          verify_binary() {
            KLM_BINARY_PATH="$1"
            /usr/bin/file "$KLM_BINARY_PATH"
            KLM_BINARY_ARCHS="$(/usr/bin/lipo "$KLM_BINARY_PATH" -archs)"
            case " $KLM_BINARY_ARCHS " in
              *' x86_64 '*) ;;
              *) exit 1 ;;
            esac
            case " $KLM_BINARY_ARCHS " in
              *' arm64 '*) ;;
              *) exit 1 ;;
            esac
            KLM_INTEL_MINOS=$(xcrun vtool -arch x86_64 -show-build "$KLM_BINARY_PATH" | \
              /usr/bin/awk '/minos/ { print $2 }' | \
              /usr/bin/sort -u)
            test "$KLM_INTEL_MINOS" = "$KLM_MACOS_DEPLOYMENT_TARGET"

            # Apple Silicon starts at macOS 11, so an arm64 framework may
            # correctly report 11.0 even though its Intel slice supports 10.15.
            KLM_ARM_MINOS=$(xcrun vtool -arch arm64 -show-build "$KLM_BINARY_PATH" | \
              /usr/bin/awk '/minos/ { print $2 }' | \
              /usr/bin/sort -u)
            case "$KLM_ARM_MINOS" in
              10.15|11.0) ;;
              *) exit 1 ;;
            esac
          }

          verify_binary "$KLM_MAIN_BINARY"
          verify_binary "$KLM_HELPER_BINARY"
          verify_binary "$KLM_FLUTTER_BINARY"
          verify_binary "$KLM_DART_BINARY"

          KLM_SPARKLE_ARCHS="$(/usr/bin/lipo "$KLM_SPARKLE_BINARY" -archs)"
          case " $KLM_SPARKLE_ARCHS " in
            *' x86_64 '*) ;;
            *) exit 1 ;;
          esac
          case " $KLM_SPARKLE_ARCHS " in
            *' arm64 '*) ;;
            *) exit 1 ;;
          esac
          test ! -e \
            "$KLM_APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices"

          # The elevated helper must be self-contained. Flutter 3.38 can expose
          # the Runner's plugin linker flags through the project configuration;
          # loading those app frameworks in an elevated process is rejected by
          # macOS library validation when the build uses ad-hoc signing.
          KLM_HELPER_LINKS="$(/usr/bin/otool -L "$KLM_HELPER_BINARY")"
          /usr/bin/printf '%s\n' "$KLM_HELPER_LINKS"
          case "$KLM_HELPER_LINKS" in
            *'@rpath/'*|*'FlutterMacOS'*|*'shared_preferences_foundation'*)
              /usr/bin/printf '%s\n' \
                'The administrator helper contains an unexpected Flutter dependency.' >&2
              exit 1
              ;;
          esac

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$KLM_APP_PATH"

      - name: Package legacy DMG
        script: |
          set -euo pipefail
          KLM_LEGACY_DIRECTORY="build/legacy"
          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_VERSION="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' \
            "$KLM_APP_PATH/Contents/Info.plist")"
          KLM_DMG="$KLM_LEGACY_DIRECTORY/klm-macOS-v${KLM_VERSION}.dmg"
          /bin/mkdir -p "$KLM_LEGACY_DIRECTORY"
          KLM_PREPARE_APP=false \
            tool/package_macos_dmg.sh "$KLM_APP_PATH" "$KLM_DMG"

      - name: Generate signed legacy appcast
        script: |
          set -euo pipefail
          if test -z "${KLM_SPARKLE_PRIVATE_KEY:-}"; then
            /usr/bin/printf '%s\n' \
              'KLM_SPARKLE_PRIVATE_KEY is not configured; appcast generation skipped.'
            exit 0
          fi

          KLM_APP_PATH="build/macos/Build/Products/Release/${KLM_APP_NAME}.app"
          KLM_VERSION="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' \
            "$KLM_APP_PATH/Contents/Info.plist")"
          export KLM_UPDATE_DOWNLOAD_URL_PREFIX="https://github.com/cloinse/klm/releases/download/v${KLM_VERSION}"
          tool/generate_macos_appcast.sh \
            build/legacy \
            build/legacy/appcast-macos-legacy.xml

    artifacts:
      - build/legacy/*.dmg
      - build/legacy/*.dmg.sha256
      - build/legacy/appcast-macos-legacy.xml

  windows-release:
    name: Kontakt Library Manager - Windows
    instance_type: windows_x2
    max_build_duration: 20

    environment:
      flutter: stable

    cache:
      cache_paths:
        - ~/.pub-cache
        - $CM_BUILD_DIR/build/windows/x64

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release
        script: flutter build windows --release --no-pub

      - name: Verify and stage Windows application
        script: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:CM_BUILD_DIR "build/windows/x64/runner/Release"

          # A portable Flutter bundle must carry the application-local Visual
          # C++ runtime instead of relying on it being installed on the PC.
          $vswherePath = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswherePath)) {
            throw "Visual Studio locator was not found: $vswherePath"
          }

          $vsInstall = (& $vswherePath -latest -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1)
          $vsInstall = "$vsInstall".Trim()
          if (-not $vsInstall) {
            throw "A Visual Studio installation with the C++ toolchain was not found."
          }

          $redistRoot = Join-Path $vsInstall "VC/Redist/MSVC"
          $crtDir = Get-ChildItem -Path $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              Join-Path $_.FullName "x64/Microsoft.VC143.CRT"
            } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "The x64 Visual C++ application-local runtime was not found."
          }

          $runtimeDlls = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($runtimeDll in $runtimeDlls) {
            $source = Join-Path $crtDir $runtimeDll
            if (-not (Test-Path $source)) {
              throw "Missing Visual C++ runtime file: $source"
            }
            Copy-Item -Force $source $releaseDir
          }

          $requiredPaths = @(
            "kontakt_library_manager.exe",
            "flutter_windows.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "data/icudtl.dat",
            "data/app.so",
            "data/flutter_assets"
          )
          foreach ($relativePath in $requiredPaths) {
            if (-not (Test-Path (Join-Path $releaseDir $relativePath))) {
              throw "Missing required release file: $relativePath"
            }
          }

      - name: Create single-file portable application
        script: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:CM_BUILD_DIR "build/windows/x64/runner/Release"
          $artifactDir = Join-Path $env:CM_BUILD_DIR "build/artifacts"
          $portableDir = Join-Path $env:CM_BUILD_DIR "build/portable"
          $payloadPath = Join-Path $portableDir "kontakt-library-manager.7z"
          $sdkArchivePath = Join-Path $portableDir "lzma2602.7z"
          $sfxDir = Join-Path $portableDir "lzma-sdk"
          $portablePath = Join-Path $artifactDir "Kontakt-Library-Manager-Portable.exe"
          $portableManifestPath = Join-Path $env:CM_BUILD_DIR `
            "windows/portable/portable.exe.manifest"

          $lzmaSdkUrl = `
            "https://github.com/ip7z/7zip/releases/download/26.02/lzma2602.7z"
          $lzmaSdkSha256 = `
            "2878c85f5f43a4a4e0952b1fd4e5fe097c1c143997a8047c7e1e788892aa9357"

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          curl.exe --fail --location --retry 3 `
            --output $sdkArchivePath $lzmaSdkUrl
          if ($LASTEXITCODE -ne 0) {
            throw "The official LZMA SDK could not be downloaded."
          }

          $downloadedSha256 = (Get-FileHash -Algorithm SHA256 `
            $sdkArchivePath).Hash.ToLowerInvariant()
          if ($downloadedSha256 -ne $lzmaSdkSha256) {
            throw "The downloaded LZMA SDK failed SHA-256 verification."
          }

          & 7z x $sdkArchivePath "-o$sfxDir" "bin/7zS2.sfx" -y
          if ($LASTEXITCODE -ne 0) {
            throw "The LZMA SDK SFX module could not be extracted."
          }

          $sfxModulePath = Join-Path $sfxDir "bin/7zS2.sfx"
          if (-not (Test-Path $sfxModulePath)) {
            throw "The official LZMA SDK SFX module was not found."
          }

          $topLevelExecutables = @(Get-ChildItem $releaseDir -Filter "*.exe" -File)
          if ($topLevelExecutables.Count -ne 1 -or `
              $topLevelExecutables[0].Name -ne "kontakt_library_manager.exe") {
            throw "The portable payload must contain only kontakt_library_manager.exe."
          }

          Push-Location $releaseDir
          try {
            # Fast compression limits paid Windows runner time.
            & 7z a -t7z -m0=LZMA2 -mx=1 -mmt=on $payloadPath ".\*"
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed to create the portable payload."
            }
          } finally {
            Pop-Location
          }

          $windowsSdkRoot = Join-Path ${env:ProgramFiles(x86)} `
            "Windows Kits/10/bin"
          $mtPath = Get-ChildItem -Path $windowsSdkRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              Join-Path $_.FullName "x64/mt.exe"
            } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $mtPath) {
            throw "The Windows manifest tool was not found."
          }

          Copy-Item -Force $sfxModulePath $portablePath
          & $mtPath -nologo -manifest $portableManifestPath `
            "-outputresource:$portablePath;#1"
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows compatibility/UAC manifest could not be embedded."
          }

          $output = [System.IO.File]::Open(
            $portablePath,
            [System.IO.FileMode]::Append,
            [System.IO.FileAccess]::Write
          )
          try {
            $input = [System.IO.File]::OpenRead($payloadPath)
            try {
              $input.CopyTo($output)
            } finally {
              $input.Dispose()
            }
          } finally {
            $output.Dispose()
          }

          & 7z t $portablePath
          if ($LASTEXITCODE -ne 0) {
            throw "The single-file portable application failed its integrity check."
          }
          if ((Get-Item $portablePath).Length -le (Get-Item $payloadPath).Length) {
            throw "The portable executable does not contain the SFX launcher."
          }

    artifacts:
      - build/artifacts/Kontakt-Library-Manager-Portable.exe
